plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'kr.ac.dankook.ace'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    implementation 'org.modelmapper:modelmapper:3.0.0'
    implementation 'com.openai:openai-java:0.31.0'
    implementation 'net.coobird:thumbnailator:0.4.20'// 이미지 압축 처리 로직
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // SpringSecurity
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // Jackson 직렬화/역직렬화 지원
    // 사용자 인증을 위한 패스워드 암호화 (선택)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 패스워드 인코딩용 (BCrypt 등)
    implementation 'org.springframework.security:spring-security-crypto'
    // Levenshtein 문자열 유사도 측정용
    implementation 'org.apache.commons:commons-text:1.11.0'
    // gRPC
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-stub:1.60.0'
    implementation 'io.grpc:grpc-protobuf:1.60.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    // gRPC for Mac M2
    runtimeOnly 'io.netty:netty-tcnative-boringssl-static:2.0.61.Final'
}

tasks.named('test') {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.1"
        plugins {
            grpc {
                artifact = "io.grpc:protoc-gen-grpc-java:1.60.0"
            }
        }
        generateProtoTasks {
            all()*.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

